# Docker development only. K8s: Filebeat DaemonSet reading pod logs, no socket.
filebeat.autodiscover:
  providers:
    - type: docker
      host: unix:///var/run/docker.sock
      hints.enabled: false
      templates:
        - condition:
            regexp:
              docker.container.name: '^/?finance-(api|webapp|migrate)-'
          config:
            - type: filestream
              id: finance-${data.docker.container.id}
              prospector.scanner.symlinks: true
              parsers:
                - container:
                    stream: all
                    format: docker
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock

output.logstash:
  hosts: ["logstash:5044"]

logging.level: warning
