input {
  beats {
    port => 5044
    ecs_compatibility => v8
  }
}
filter {
  # Remove routine health probes before indexing.
  if [message] =~ /(?:GET|HEAD) \/(?:healthz|readyz)(?:\s|\?|")/ {
    drop {}
  }
  json {
    source => "message"
    target => "app"
    tag_on_failure => []
  }
  ruby {
    path => "/ops/logstash/redact.rb"
  }
}
output {
  elasticsearch {
    hosts => ["${ES_URL:http://elasticsearch:9200}"]
    user => "logstash_writer"
    password => "${ES_WRITER_PASSWORD}"
    index => "logs-finance-%{+YYYY.MM.dd}"
    manage_template => false
    ilm_enabled => false
    ecs_compatibility => v8
  }
}
