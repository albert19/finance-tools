# Copy to ~/.config/finance-app/config.toml (or point FINANCE_APP_CONFIG at it).
# Environment variables FINANCE_SPREADSHEET_ID and GOOGLE_APPLICATION_CREDENTIALS override these.

[google_sheets]
spreadsheet_id = "your-spreadsheet-id"            # the long id in the sheet URL
credentials_path = "~/.config/finance-app/service-account.json"

[ui]
language = "en"                 # default UI language: "en" or "es" (FINANCE_APP_LANGUAGE overrides)

[simulation]
scenario_delta_pct = 2.0        # pessimistic / optimistic = base return -/+ this many points

[portfolio]
deviation_tolerance_pct = 2.0   # within +/- this % of the projection counts as "On track"

[budget]
tolerance_pct = 2.0             # within +/- this % of the planned amount counts as "On budget"

# Spanish savings-income brackets (verify against current law). Last bracket has no upper limit.
[[taxes.brackets]]
upper = 6000
rate_pct = 19
[[taxes.brackets]]
upper = 50000
rate_pct = 21
[[taxes.brackets]]
upper = 200000
rate_pct = 23
[[taxes.brackets]]
upper = 300000
rate_pct = 27
[[taxes.brackets]]
rate_pct = 30
