worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # $request includes raw query strings; never put them in access logs.
    log_format finance_json escape=json '{"@timestamp":"$time_iso8601","message":"$request_method $uri",'
        '"http":{"request":{"method":"$request_method"},"response":{"status_code":$status}},'
        '"url":{"path":"$uri"},"client":{"ip":"$remote_addr"},'
        '"duration_s":$request_time}';
    access_log /dev/stdout finance_json;
    include /etc/nginx/conf.d/*.conf;
}
