[project]
name = "finance-app"
version = "0.1.0"
description = "Finance manager: investment simulator, portfolio tracker and budgets (PySide6 + Google Sheets)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6==6.12.0",
    "google-api-python-client==2.202.0",
    "google-auth==2.62.2",
]

[project.scripts]
finance-app = "finance_app.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
