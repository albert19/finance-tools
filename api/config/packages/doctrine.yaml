doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    schema_filter: '~^(?!login_throttles$)~'
  orm:
    enable_native_lazy_objects: true
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Entity'
        alias: App
